<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatic Mapping Dashboard</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --base: #0f1117; --card: #161922; --elevated: #1c2030; --border: #262d3d;
            --accent: #3b82f6; --accent-dim: #2563eb;
            --green: #22c55e; --red: #ef4444; --yellow: #eab308; --orange: #f97316;
            --text: #e2e8f0; --text-dim: #64748b; --text-muted: #475569;
        }
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; background: var(--base); color: var(--text); min-height: 100vh; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Header */
        .header {
            background: var(--card); border-bottom: 1px solid var(--border);
            padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 24px; }
        .logo { font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--accent); }
        .tabs { display: flex; gap: 4px; }
        .tab-btn {
            padding: 8px 16px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
            color: var(--text-dim); background: transparent; border: none; border-radius: 6px;
            cursor: pointer; transition: all 0.15s;
        }
        .tab-btn:hover { color: var(--text); background: var(--elevated); }
        .tab-btn.active { color: var(--accent); background: rgba(59,130,246,0.1); }
        .header-right { display: flex; align-items: center; gap: 12px; font-size: 12px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: var(--green); }
        .status-dot.offline { background: var(--red); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .status-dot.pulse { animation: pulse 2s infinite; }

        /* Main */
        .main { padding: 20px 24px; max-width: 1600px; margin: 0 auto; }

        /* Cards */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .card-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 13px; font-weight: 600;
        }
        .card-header i { color: var(--accent); margin-right: 8px; font-size: 12px; }
        .card-body { padding: 16px; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
            border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
            transition: all 0.15s; background: var(--elevated); color: var(--text);
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-green { background: var(--green); border-color: var(--green); color: #000; }
        .btn-green:hover { background: #16a34a; border-color: #16a34a; color: #000; }
        .btn-red { background: var(--red); border-color: var(--red); color: #fff; }
        .btn-red:hover { background: #dc2626; border-color: #dc2626; }
        .btn-yellow { background: var(--yellow); border-color: var(--yellow); color: #000; }
        .btn-yellow:hover { background: #ca8a04; border-color: #ca8a04; color: #000; }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-accent:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-block { width: 100%; justify-content: center; }

        /* Forms */
        .form-label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 500; }
        .form-input, .form-select {
            width: 100%; padding: 8px 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
            background: var(--base); border: 1px solid var(--border); border-radius: 4px; color: var(--text);
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .checkbox-label {
            display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim);
            cursor: pointer; padding: 4px 8px; background: var(--base); border: 1px solid var(--border);
            border-radius: 4px; transition: all 0.15s;
        }
        .checkbox-label:has(input:checked) { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.08); }
        .checkbox-label input { display: none; }

        /* Progress bar */
        .progress { height: 6px; background: var(--base); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .progress-fill.green { background: var(--green); }
        .progress-fill.blue { background: var(--accent); }
        .progress-fill.yellow { background: var(--yellow); }
        .progress-fill.red { background: var(--red); }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

        /* Worker cards */
        .worker-card { border: 1px solid var(--border); border-radius: 6px; padding: 12px; background: var(--elevated); }
        .worker-card .worker-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .worker-card .worker-job { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
        .worker-card .worker-actions { display: flex; gap: 4px; margin-top: 8px; }
        .worker-card .progress-img { width: 100%; border-radius: 4px; margin-top: 8px; border: 1px solid var(--border); }

        /* Status bar */
        .status-bar { display: flex; gap: 24px; padding: 12px 16px; background: var(--elevated); border-radius: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .status-item { display: flex; flex-direction: column; gap: 2px; }
        .status-item .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; }
        .status-item .value { font-size: 16px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .status-item .value.green { color: var(--green); }
        .status-item .value.red { color: var(--red); }
        .status-item .value.yellow { color: var(--yellow); }
        .status-item .value.blue { color: var(--accent); }

        /* Log panel */
        .log-panel {
            background: var(--base); border: 1px solid var(--border); border-radius: 4px;
            padding: 12px; max-height: 300px; overflow-y: auto; font-family: 'JetBrains Mono', monospace;
            font-size: 11px; line-height: 1.6; color: var(--text-dim);
        }

        /* Job queue table */
        .table-wrap { overflow-x: auto; max-height: 350px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { text-align: left; padding: 8px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 1; }
        td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: var(--elevated); }
        .badge { display: inline-block; padding: 2px 8px; font-size: 10px; border-radius: 3px; font-weight: 500; }
        .badge-running { background: rgba(59,130,246,0.15); color: var(--accent); }
        .badge-completed { background: rgba(34,197,94,0.15); color: var(--green); }
        .badge-failed { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge-pending { background: rgba(100,116,139,0.15); color: var(--text-dim); }

        /* Stats cards */
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .stat-card .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .stat-value { font-size: 24px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--accent); margin-bottom: 8px; }

        /* Image grid */
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
        .image-card {
            border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
            cursor: pointer; transition: all 0.15s; background: var(--card);
        }
        .image-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .image-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
        .image-card .image-label { padding: 8px 10px; font-size: 11px; color: var(--text-dim); text-align: center; }

        /* Trial cards */
        .trial-card {
            border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
            cursor: pointer; transition: all 0.15s; background: var(--card);
        }
        .trial-card:hover { border-color: var(--accent); }
        .trial-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--base); }
        .trial-card .trial-card-body { padding: 10px 12px; }
        .trial-card .trial-card-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
        .trial-card .trial-card-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 10px; font-family: 'JetBrains Mono', monospace; }
        .trial-card .trial-card-metrics .metric-label { color: var(--text-dim); }
        .trial-card .trial-card-metrics .metric-value { color: var(--green); text-align: right; }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 10000;
            display: flex; align-items: center; justify-content: center; padding: 30px;
        }
        .lightbox img { max-width: 95%; max-height: 95%; border-radius: 4px; }
        .lightbox-close { position: absolute; top: 16px; right: 20px; color: var(--text); font-size: 28px; cursor: pointer; background: none; border: none; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9000;
            display: flex; align-items: center; justify-content: center; padding: 30px;
        }
        .modal-content {
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            max-width: 1100px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }

        /* VNC link cards */
        .vnc-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: var(--elevated); border: 1px solid var(--border);
            border-radius: 6px; margin-bottom: 8px;
        }
        .vnc-card .vnc-label { font-size: 12px; font-weight: 500; }
        .vnc-card .vnc-port { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

        /* Toast */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10001; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 250px; }
        .toast.error { border-color: var(--red); }
        .toast.success { border-color: var(--green); }
        .toast i.fa-check-circle { color: var(--green); }
        .toast i.fa-times-circle { color: var(--red); }
        .toast i.fa-info-circle { color: var(--accent); }

        /* Filter bar */
        .filter-bar { display: flex; gap: 12px; align-items: flex-end; padding: 12px 0; flex-wrap: wrap; }
        .filter-bar .filter-group { flex: 1; min-width: 140px; }
        .filter-bar .filter-group label { display: block; font-size: 10px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
        .filter-bar .filter-group select, .filter-bar .filter-group input { width: 100%; padding: 6px 8px; font-size: 11px; background: var(--base); border: 1px solid var(--border); border-radius: 4px; color: var(--text); }
        .filter-bar .filter-group select:focus, .filter-bar .filter-group input:focus { outline: none; border-color: var(--accent); }

        /* CSV table colors */
        .effect-large { color: var(--green); font-weight: 600; }
        .effect-medium { color: var(--yellow); }
        .effect-small { color: var(--orange); }
        .effect-negligible { color: var(--red); }
        .p-significant { color: var(--green); font-weight: 600; }

        /* Responsive */
        @media (max-width: 1100px) { .grid-3 { grid-template-columns: 1fr 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .header { padding: 0 12px; } .main { padding: 12px; } .tabs { flex-wrap: wrap; } .status-bar { gap: 12px; } }
    </style>
</head>
<body x-data="dashboard()" x-init="init()" @keydown.escape.window="lightbox.show = false; trialModal.show = false">

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo"><i class="fas fa-water"></i> Aquatic Mapping</div>
            <nav class="tabs">
                <button @click="tab = 'manager'" :class="tab === 'manager' ? 'active' : ''" class="tab-btn">
                    <i class="fas fa-play-circle"></i> Trial Manager
                </button>
                <button @click="tab = 'results'" :class="tab === 'results' ? 'active' : ''" class="tab-btn">
                    <i class="fas fa-chart-bar"></i> Results
                </button>
                <button @click="tab = 'system'" :class="tab === 'system' ? 'active' : ''" class="tab-btn">
                    <i class="fas fa-server"></i> System
                </button>
            </nav>
        </div>
        <div class="header-right">
            <span class="status-dot" :class="connected ? 'online pulse' : 'offline'"></span>
            <span x-text="connected ? 'Connected' : 'Disconnected'" style="font-size: 12px;"></span>
            <button @click="logout()" class="btn btn-sm"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <main class="main">

        <!-- ================================================================ -->
        <!-- TAB 1: TRIAL MANAGER -->
        <!-- ================================================================ -->
        <div x-show="tab === 'manager'" x-cloak>

            <!-- Config Panel -->
            <div class="card" style="margin-bottom: 16px;">
                <div class="card-header"><span><i class="fas fa-cog"></i> Configuration</span></div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: auto auto auto 1fr 1fr; gap: 16px; align-items: end;">
                        <!-- Trial Range -->
                        <div>
                            <label class="form-label">Start Trial</label>
                            <input type="number" x-model.number="config.start_trial" min="1" class="form-input" style="width: 80px;">
                        </div>
                        <div>
                            <label class="form-label">End Trial</label>
                            <input type="number" x-model.number="config.end_trial" min="1" class="form-input" style="width: 80px;">
                        </div>
                        <div>
                            <label class="form-label">Workers</label>
                            <select x-model.number="config.workers" class="form-select" style="width: 80px;">
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                            </select>
                        </div>
                        <!-- Fields -->
                        <div>
                            <label class="form-label">Fields</label>
                            <div class="checkbox-group">
                                <template x-for="f in allFields" :key="f">
                                    <label class="checkbox-label">
                                        <input type="checkbox" :value="f" x-model="config.fields">
                                        <span x-text="f.replace('_', ' ')"></span>
                                    </label>
                                </template>
                            </div>
                        </div>
                        <!-- Planners -->
                        <div>
                            <label class="form-label">Planners</label>
                            <div class="checkbox-group">
                                <template x-for="p in allPlanners" :key="p">
                                    <label class="checkbox-label">
                                        <input type="checkbox" :value="p" x-model="config.planners">
                                        <span x-text="shortPlanner(p)"></span>
                                    </label>
                                </template>
                            </div>
                        </div>
                    </div>
                    <!-- Action buttons -->
                    <div style="display: flex; gap: 8px; margin-top: 16px;">
                        <button @click="startOrchestrator()" :disabled="orchestrator_running" class="btn btn-green">
                            <i class="fas fa-play"></i> START
                        </button>
                        <button @click="stopOrchestrator()" :disabled="!orchestrator_running" class="btn btn-red">
                            <i class="fas fa-stop"></i> STOP
                        </button>
                        <button @click="retryOrchestrator()" :disabled="orchestrator_running" class="btn btn-yellow">
                            <i class="fas fa-redo"></i> RETRY
                        </button>
                        <button @click="cleanData()" :disabled="orchestrator_running" class="btn">
                            <i class="fas fa-trash"></i> CLEAN
                        </button>
                    </div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="label">State</span>
                    <span class="value" :class="orchestrator_running ? 'green' : (orchestrator.state === 'stopped' ? 'red' : 'blue')"
                          x-text="orchestrator_running ? 'Running' : (orchestrator.state || 'Idle')"></span>
                </div>
                <div class="status-item">
                    <span class="label">Completed</span>
                    <span class="value green" x-text="(orchestrator.completed_jobs || 0) + '/' + (orchestrator.total_jobs || 0)"></span>
                </div>
                <div class="status-item">
                    <span class="label">Failed</span>
                    <span class="value" :class="(orchestrator.failed_jobs || 0) > 0 ? 'red' : ''" x-text="orchestrator.failed_jobs || 0"></span>
                </div>
                <div class="status-item">
                    <span class="label">Remaining</span>
                    <span class="value" x-text="orchestrator.jobs_remaining || 0"></span>
                </div>
                <div class="status-item">
                    <span class="label">Elapsed</span>
                    <span class="value mono" x-text="formatElapsed(orchestrator.elapsed_seconds || 0)"></span>
                </div>
            </div>

            <!-- Worker Grid -->
            <div class="card" style="margin-bottom: 16px;">
                <div class="card-header"><span><i class="fas fa-cubes"></i> Workers</span></div>
                <div class="card-body">
                    <div class="grid-3">
                        <template x-for="slot in [0,1,2,3,4,5]" :key="slot">
                            <div class="worker-card" x-show="slot < (config.workers || 4)">
                                <div class="worker-title">
                                    <span>Worker <span x-text="slot"></span></span>
                                    <span class="status-dot" :class="getWorkerJob(slot) ? 'online pulse' : 'offline'" style="width: 6px; height: 6px;"></span>
                                </div>
                                <div class="worker-job" x-text="getWorkerJob(slot) || 'Idle'"></div>
                                <div class="progress">
                                    <div class="progress-fill blue" :style="'width:' + getWorkerSamples(slot) + '%'"></div>
                                </div>
                                <div style="font-size: 10px; color: var(--text-dim); margin-top: 4px;" x-text="getWorkerSamplesRaw(slot) + '/100 samples'"></div>
                                <!-- Progress image -->
                                <template x-if="getWorkerJob(slot) && getWorkerProgressImage(slot)">
                                    <img :src="getWorkerProgressImage(slot) + '?t=' + refreshTick"
                                         class="progress-img" onerror="this.style.display='none'" onload="this.style.display='block'">
                                </template>
                                <div class="worker-actions">
                                    <a :href="'http://' + location.hostname + ':' + (6090 + slot) + '/vnc.html'" target="_blank" class="btn btn-sm">
                                        <i class="fas fa-desktop"></i> VNC
                                    </a>
                                    <button @click="killWorker(slot)" class="btn btn-sm btn-red"><i class="fas fa-times"></i> Kill</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Bottom: Job Queue + Logs -->
            <div class="grid-2">
                <!-- Job Queue -->
                <div class="card">
                    <div class="card-header">
                        <span><i class="fas fa-list"></i> Job Queue</span>
                        <span style="font-size: 11px; color: var(--text-dim);" x-text="Object.keys(orchestrator.job_list || {}).length + ' jobs'"></span>
                    </div>
                    <div class="table-wrap" style="max-height: 350px;">
                        <table>
                            <thead><tr><th>Planner</th><th>Field</th><th>Trial</th><th>Status</th></tr></thead>
                            <tbody>
                                <template x-for="job in sortedJobs" :key="job.key">
                                    <tr>
                                        <td x-text="job.planner" class="mono" style="font-size: 10px;"></td>
                                        <td x-text="job.field" style="font-size: 10px;"></td>
                                        <td x-text="job.trial" class="mono" style="font-size: 10px;"></td>
                                        <td>
                                            <span class="badge" :class="{
                                                'badge-running': job.status === 'running',
                                                'badge-completed': job.status === 'completed',
                                                'badge-failed': job.status === 'failed',
                                                'badge-pending': job.status === 'pending'
                                            }" x-text="job.status"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template x-if="sortedJobs.length === 0">
                            <div style="padding: 30px; text-align: center; color: var(--text-dim); font-size: 12px;">No jobs</div>
                        </template>
                    </div>
                </div>

                <!-- Logs -->
                <div class="card">
                    <div class="card-header"><span><i class="fas fa-terminal"></i> Orchestrator Logs</span></div>
                    <div class="log-panel" x-ref="logPanel">
                        <template x-for="(line, i) in orchLogs" :key="i">
                            <div x-text="line"></div>
                        </template>
                        <template x-if="orchLogs.length === 0">
                            <div style="color: var(--text-muted);">No log output</div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- TAB 2: RESULTS VIEWER -->
        <!-- ================================================================ -->

        <!-- ================================================================ -->
        <!-- TAB 3: SYSTEM -->

        <div x-show="tab === 'system'" x-cloak x-init="$watch('tab', v => v === 'system' && checkHostVnc())">

            <!-- Resource Cards -->

                        </div>
                    </template>
                    <template x-if="!system.gpu"><div class="stat-value" style="color: var(--text-dim);">N/A</div></template>
                </div>
                <div class="stat-card">
                    <div class="stat-label">GPU Memory</div>

                        <div>
                            <div class="stat-value" x-text="Math.round(system.gpu.memory_used_mb/1024*10)/10 + '/' + Math.round(system.gpu.memory_total_mb/1024*10)/10 + ' GB'"></div>
                            <div class="progress"><div class="progress-fill yellow" :style="'width:' + (system.gpu.memory_used_mb / system.gpu.memory_total_mb * 100) + '%'"></div></div>

            <div class="grid-2">
                <!-- Host Remote Desktop -->

                    <div class="card-header"><span><i class="fas fa-desktop"></i> Host Remote Desktop</span></div>

                            </a>
                        </template>
                    </div>
                </div>

                <!-- System Info + Worker VNC -->
                <div class="card">
                    <div class="card-header"><span><i class="fas fa-info-circle"></i> System Info</span></div>
                    <div class="card-body">
                        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
                            <div style="display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border);">

                                <span x-text="system.gpu ? system.gpu.name : 'N/A'"></span>

                            <div style="display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border);">
                                <span style="color: var(--text-dim);">System RAM</span>
                                <span x-text="system.memory_total_gb + ' GB'"></span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border);">
                                <span style="color: var(--text-dim);">Orchestrator</span>

                        <div style="font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase;">Worker VNC Links</div>

                                    <i class="fas fa-external-link-alt"></i> Open

    <!-- Lightbox -->

    <!-- Trial Detail Modal -->
    <div x-show="trialModal.show" x-cloak class="modal-overlay" @click.self="trialModal.show = false">
        <div class="modal-content">
            <div class="modal-header">
                <span style="font-weight: 600;" x-text="trialModal.title"></span>
                <button class="modal-close" @click="trialModal.show = false"><i class="fas fa-times"></i></button>

            <div class="modal-body">
                <!-- Figures -->

                                    <span class="mono" x-text="typeof trialModal.summary[key] === 'number' ? trialModal.summary[key].toFixed(4) : trialModal.summary[key]"></span>

    <!-- Toasts -->

                <i :class="notif.type === 'success' ? 'fas fa-check-circle' : notif.type === 'error' ? 'fas fa-times-circle' : 'fas fa-info-circle'"></i>
                <span x-text="notif.message"></span>
            </div>
        </template>
    </div>

    <script>
    function dashboard() {
        return {
            tab: 'manager',
            connected: false,
            ws: null,
            notifications: [],
            refreshTick: Date.now(),

            // Auth
            getAuthHeader() {
                const auth = sessionStorage.getItem('auth');
                return auth ? { 'Authorization': 'Basic ' + auth } : {};
            },
            async authFetch(url, options = {}) {
                const headers = { ...options.headers, ...this.getAuthHeader() };
                const response = await fetch(url, { ...options, headers });
                if (response.status === 401) {
                    sessionStorage.removeItem('auth');
                    sessionStorage.removeItem('username');
                    window.location.href = '/login';
                    throw new Error('Unauthorized');
                }
                return response;
            },

            // Config
            allFields: ['radial', 'x_compress', 'y_compress', 'x_compress_tilt', 'y_compress_tilt'],
            allPlanners: ['exact', 'analytical', 'nonstationary_exact', 'nonstationary_pose_aware', 'nonstationary_exact_weighted', 'nonstationary_pose_aware_weighted'],
            config: {
                start_trial: 1, end_trial: 15, workers: 4,
                fields: ['radial', 'x_compress', 'y_compress', 'x_compress_tilt', 'y_compress_tilt'],
                planners: ['exact', 'analytical', 'nonstationary_exact', 'nonstationary_pose_aware', 'nonstationary_exact_weighted', 'nonstationary_pose_aware_weighted'],
            },

            // Orchestrator state (from WebSocket)
            orchestrator: {},
            orchestrator_running: false,
            orchLogs: [],
            scriptRunning: false,

            // System
            system: { cpu_percent: 0, memory_percent: 0, memory_used_gb: 0, memory_total_gb: 0, gpu: null },

            // Results
            results: { trials: [], filters: { planner: 'all', field: 'all', trial: '' } },
            statisticsFiles: [],
            resultsLoading: false,
            csvData: { grouped: { headers: [], rows: [] }, tests: { headers: [], rows: [] } },

            // Script runner
            scriptOutput: [],

            // Lightbox
            lightbox: { show: false, src: '' },

            // Trial modal
            trialModal: { show: false, title: '', summary: {}, imagePath: '' },

            // Host VNC
            hostVnc: { running: false },

            // Computed
            get statisticsImages() {
                return this.statisticsFiles.filter(f => f.ext === '.png');
            },
            get filteredTrials() {
                return this.results.trials.filter(t => {
                    if (this.results.filters.planner !== 'all' && t.planner !== this.results.filters.planner) return false;
                    if (this.results.filters.field !== 'all' && t.field !== this.results.filters.field) return false;
                    if (this.results.filters.trial && !t.trial.includes(this.results.filters.trial)) return false;
                    return t.has_summary;
                });
            },
            get sortedJobs() {
                const jobs = [];
                const jl = this.orchestrator.job_list || {};
                for (const [key, val] of Object.entries(jl)) {
                    const parts = key.split('/');
                    jobs.push({ key, planner: parts[0] || '', field: parts[1] || '', trial: parts[2] || '', status: val.status || 'pending' });
                }
                const order = { running: 0, failed: 1, pending: 2, completed: 3 };
                jobs.sort((a, b) => (order[a.status] ?? 4) - (order[b.status] ?? 4));
                return jobs;
            },

            // Init
            init() {
                if (!sessionStorage.getItem('auth')) {
                    window.location.href = '/login';
                    return;
                }
                this.connectWebSocket();
                this.pollLogs();
                this.pollScriptStatus();
                // Refresh progress images every 5s
                setInterval(() => { this.refreshTick = Date.now(); }, 5000);
            },

            connectWebSocket() {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                this.ws = new WebSocket(`${protocol}//${location.host}/ws`);
                this.ws.onopen = () => { this.connected = true; };
                this.ws.onclose = () => { this.connected = false; setTimeout(() => this.connectWebSocket(), 3000); };
                this.ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.system) this.system = data.system;
                    if (data.orchestrator) this.orchestrator = data.orchestrator;
                    if (data.orchestrator_running !== undefined) this.orchestrator_running = data.orchestrator_running;
                    if (data.script_running !== undefined) this.scriptRunning = data.script_running;
                };
            },

            // Orchestrator actions
            async startOrchestrator() {
                try {
                    const resp = await this.authFetch('/api/orchestrator/start', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.config)
                    });
                    const data = await resp.json();
                    if (resp.ok) { this.notify('success', 'Orchestrator started'); }
                    else { this.notify('error', data.detail || 'Failed to start'); }
                } catch (e) { this.notify('error', 'Failed to start orchestrator'); }
            },
            async stopOrchestrator() {
                if (!confirm('Stop orchestrator and all workers?')) return;
                try {
                    await this.authFetch('/api/orchestrator/stop', { method: 'POST' });
                    this.notify('success', 'Orchestrator stopped');
                } catch (e) { this.notify('error', 'Failed to stop'); }
            },
            async retryOrchestrator() {
                try {
                    const resp = await this.authFetch('/api/orchestrator/retry', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.config)
                    });
                    const data = await resp.json();
                    if (resp.ok) { this.notify('success', 'Retry mode started'); }
                    else { this.notify('error', data.detail || 'Failed'); }
                } catch (e) { this.notify('error', 'Failed to start retry'); }
            },
            async cleanData() {
                if (!confirm('Clean trial data for selected planners? This will delete data!')) return;
                try {
                    const resp = await this.authFetch('/api/orchestrator/clean', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            mode: 'range', start_trial: this.config.start_trial,
                            end_trial: this.config.end_trial, planners: this.config.planners, backup: true
                        })
                    });
                    const data = await resp.json();
                    this.notify(data.success ? 'success' : 'error', `Deleted ${data.deleted.length} items`);
                } catch (e) { this.notify('error', 'Clean failed'); }
            },
            async killWorker(slot) {
                try {
                    await this.authFetch(`/api/worker/${slot}/kill`, { method: 'POST' });
                    this.notify('success', `Worker ${slot} killed`);
                } catch (e) { this.notify('error', 'Failed to kill worker'); }
            },

            // Log polling
            async pollLogs() {
                const poll = async () => {
                    if (this.tab === 'manager') {
                        try {
                            const resp = await this.authFetch('/api/orchestrator/logs?last_n=100');
                            const data = await resp.json();
                            this.orchLogs = data.logs || [];
                            // Auto-scroll
                            this.$nextTick(() => {
                                const el = this.$refs.logPanel;
                                if (el) el.scrollTop = el.scrollHeight;
                            });
                        } catch (e) {}
                    }
                    setTimeout(poll, 3000);
                };
                poll();
            },

            // Script status polling
            async pollScriptStatus() {
                const poll = async () => {
                    if (this.scriptRunning || this.tab === 'results') {
                        try {
                            const resp = await this.authFetch('/api/results/statistics/status');
                            const data = await resp.json();
                            this.scriptRunning = data.running;
                            this.scriptOutput = data.output || [];
                            if (!data.running && this.scriptOutput.length > 0) {
                                // Reload statistics files when done
                                this.loadStatisticsFiles();
                                this.loadCsvData();
                            }
                        } catch (e) {}
                    }
                    setTimeout(poll, 3000);
                };
                poll();
            },

            // Results loading
            async loadResults() {
                this.resultsLoading = true;
                await Promise.all([
                    this.loadTrials(),
                    this.loadStatisticsFiles(),
                    this.loadCsvData()
                ]);
                this.resultsLoading = false;
            },
            async loadTrials() {
                try {
                    const resp = await this.authFetch('/api/results/trials');
                    this.results.trials = await resp.json();
                } catch (e) { this.results.trials = []; }
            },
            async loadStatisticsFiles() {
                try {
                    const resp = await this.authFetch('/api/results/statistics');
                    this.statisticsFiles = await resp.json();
                } catch (e) { this.statisticsFiles = []; }
            },
            async loadCsvData() {
                try {
                    const [g, t] = await Promise.all([
                        this.authFetch('/api/results/statistics/csv/grouped_comparisons.csv').then(r => r.ok ? r.json() : { headers: [], rows: [] }).catch(() => ({ headers: [], rows: [] })),
                        this.authFetch('/api/results/statistics/csv/statistical_tests.csv').then(r => r.ok ? r.json() : { headers: [], rows: [] }).catch(() => ({ headers: [], rows: [] })),
                    ]);
                    this.csvData.grouped = g;
                    this.csvData.tests = t;
                } catch (e) {}
            },

            // Statistics
            async runStatistics() {
                try {
                    const resp = await this.authFetch('/api/results/statistics/run', { method: 'POST' });
                    const data = await resp.json();
                    if (resp.ok) { this.scriptRunning = true; this.notify('success', 'Statistics script started'); }
                    else { this.notify('error', data.detail || 'Failed'); }
                } catch (e) { this.notify('error', 'Failed to run statistics'); }
            },

            // Trial modal
            async openTrialModal(t) {
                this.trialModal.title = `${this.shortPlanner(t.planner)} / ${t.field} / ${t.trial}`;
                this.trialModal.imagePath = `/api/results/image/trials/${t.planner}/${t.field}/${t.trial}/figures/`;
                // Fetch full summary
                try {
                    const resp = await this.authFetch(`/api/results/trial/${t.planner}/${t.field}/${t.trial}`);
                    const data = await resp.json();
                    this.trialModal.summary = data.summary || {};
                } catch (e) { this.trialModal.summary = {}; }
                this.trialModal.show = true;
            },

            // Host VNC
            async checkHostVnc() {
                try {
                    const resp = await this.authFetch('/api/host/vnc/status');
                    const data = await resp.json();
                    this.hostVnc.running = data.running;
                } catch (e) { this.hostVnc.running = false; }
            },
            async startHostVnc() {
                try {
                    await this.authFetch('/api/host/vnc/start', { method: 'POST' });
                    this.hostVnc.running = true;
                    this.notify('success', 'VNC started');
                } catch (e) { this.notify('error', 'Failed to start VNC'); }
            },
            async stopHostVnc() {
                try {
                    await this.authFetch('/api/host/vnc/stop', { method: 'POST' });
                    this.hostVnc.running = false;
                    this.notify('success', 'VNC stopped');
                } catch (e) { this.notify('error', 'Failed to stop VNC'); }
            },

            // Helpers
            shortPlanner(p) {
                const map = {
                    exact: 'Exact', analytical: 'Analytical', pose_aware: 'Pose-Aware',
                    nonstationary_exact: 'NS-Exact', nonstationary_pose_aware: 'NS-PoseAware',
                    nonstationary_exact_weighted: 'NS-Exact-W', nonstationary_pose_aware_weighted: 'NS-PoseAware-W'
                };
                return map[p] || p;
            },
            getWorkerJob(slot) {
                const w = (this.orchestrator.workers || {})[String(slot)];
                return w ? w.job : null;
            },
            getWorkerSamples(slot) {
                const w = (this.orchestrator.workers || {})[String(slot)];
                return w ? Math.min((w.samples || 0), 100) : 0;
            },
            getWorkerSamplesRaw(slot) {
                const w = (this.orchestrator.workers || {})[String(slot)];
                return w ? (w.samples || 0) : 0;
            },
            getWorkerProgressImage(slot) {
                const job = this.getWorkerJob(slot);
                if (!job) return null;
                // job format: "planner/field/trial" e.g. "exact/radial/1"
                const parts = job.split('/');
                if (parts.length < 3) return null;
                const [planner, field, trialNum] = parts;
                const trial = `trial_${String(trialNum).padStart(3, '0')}`;
                return `/api/results/image/trials/${planner}/${field}/${trial}/figures/progress.png`;
            },
            formatElapsed(seconds) {
                if (!seconds) return '0:00';
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
            },
            getCsvCellClass(header, value) {
                if (header === 'effect' || header === 'effect_size') {
                    if (value === 'large') return 'effect-large';
                    if (value === 'medium') return 'effect-medium';
                    if (value === 'small') return 'effect-small';
                    if (value === 'negligible') return 'effect-negligible';
                }
                if ((header.includes('_p') || header === 'wilcoxon_p' || header === 'ttest_p') && value) {
                    const n = parseFloat(value);
                    if (!isNaN(n) && n < 0.05) return 'p-significant';
                }
                return '';
            },
            formatCsvCell(header, value) {
                if (value === undefined || value === null) return '-';
                const n = parseFloat(value);
                if (isNaN(n)) return value;
                if (header.includes('_p') || header === 'wilcoxon_p' || header === 'ttest_p') {
                    return n < 0.0001 ? n.toExponential(2) : n.toFixed(4);
                }
                if (header.includes('cohens_d') || header.includes('ci_') || header === 'pct' || header === 'pct_improvement') {
                    return n.toFixed(3);
                }
                if (header.includes('mean') || header === 'diff' || header === 'mean_diff') {
                    return n.toFixed(4);
                }
                return value;
            },
            notify(type, message) {
                this.notifications.push({ type, message });
                setTimeout(() => this.notifications.shift(), 4000);
            },
            logout() {
                sessionStorage.removeItem('auth');
                sessionStorage.removeItem('username');
                window.location.href = '/login';
            }
        };
    }
    </script>
</body>
</html>
